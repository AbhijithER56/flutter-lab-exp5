<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marksheet – Experiment 5 | Navigation &amp; Routing</title>
  <meta name="description" content="Flutter Lab Experiment 5: two-screen student marks app using named routes and route arguments." />
  <style>
    :root {
      --navy: #0B2545; --sky: #EAF3FB; --blue: #3A86FF; --hl: #FFD60A;
      --mint: #2EC4B6; --muted: #6B7A90; --line: #D9E6F3;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #c9dcee; color: var(--navy);
      min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .route-bar {
      background: var(--navy); color: #fff; border-radius: 20px; padding: 6px 16px;
      font-size: 12px; font-family: ui-monospace, Consolas, monospace;
    }
    .route-bar b { color: var(--hl); }

    .phone {
      width: 390px; max-width: 100%; height: 800px; background: var(--sky);
      border: 8px solid #08162b; border-radius: 34px; overflow: hidden; position: relative;
      box-shadow: 0 24px 60px rgba(11,37,69,.35);
    }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--sky); transition: transform .35s ease; }
    #second { transform: translateX(100%); }
    body.on-second #second { transform: translateX(0); }
    body.on-second #home { transform: translateX(-30%); }

    .app-bar { background: var(--navy); color: #fff; padding: 18px 12px 14px; text-align: center; font-weight: 700; font-size: 17px; position: relative; flex-shrink: 0; }
    .app-bar .back { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; display: none; }
    body.on-second .app-bar .back { display: block; }
    .scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; }

    .banner { background: var(--navy); color: #fff; border-radius: 22px; padding: 18px; display: flex; gap: 14px; align-items: center; }
    .badge-ico { width: 52px; height: 52px; border-radius: 16px; background: var(--hl); color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
    .banner h1 { font-size: 17px; font-weight: 800; }
    .banner p { font-size: 12px; color: #B9C8DC; margin-top: 4px; }

    .panel { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
    form.panel { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px 4px; }
    .field input { width: 100%; padding: 14px; font-size: 15px; background: #F6FAFE; border: 1px solid #D3E2F1; border-radius: 14px; color: var(--navy); outline: none; }
    .field input:focus { border: 1.8px solid var(--blue); padding: 13.2px; }
    .field.bad input { border-color: #d62839; }
    .err { color: #d62839; font-size: 12px; margin: 4px 0 0 4px; display: none; }
    .field.bad .err { display: block; }
    .btn { border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; color: #fff; }
    .btn.go { background: var(--blue); }
    .btn.back-btn { background: var(--navy); }
    .btn:active { transform: scale(.98); }
    .link { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 6px; }

    .who { display: flex; gap: 14px; align-items: center; }
    .who .badge-ico { width: 48px; height: 48px; border-radius: 14px; font-size: 22px; }
    .who b { font-size: 17px; font-weight: 800; display: block; }
    .who span { color: var(--muted); font-size: 14px; }

    .ring-row { display: flex; align-items: center; gap: 18px; }
    .ring { width: 110px; height: 110px; border-radius: 50%; position: relative; flex-shrink: 0;
      background: conic-gradient(var(--blue) calc(var(--p) * 1%), #E1EDF8 0); display: flex; align-items: center; justify-content: center; }
    .ring::before { content: ''; position: absolute; inset: 10px; background: #fff; border-radius: 50%; }
    .ring span { position: relative; font-weight: 900; font-size: 18px; }
    .ring-row small { color: var(--muted); display: block; margin-bottom: 8px; }
    .grade { display: inline-block; background: var(--hl); font-weight: 900; padding: 6px 14px; border-radius: 10px; }

    .title { font-weight: 800; font-size: 16px; margin-bottom: 8px; }
    .mark { padding: 6px 0; }
    .mark .row { display: flex; justify-content: space-between; font-size: 14px; }
    .mark .row b { font-weight: 700; }
    .bar { height: 6px; border-radius: 4px; background: #DDF4F1; margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--mint); border-radius: 4px; }
    .res { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
    .res b { font-weight: 800; }

    .snack { position: absolute; left: 16px; right: 16px; bottom: 16px; background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 13px; transform: translateY(90px); transition: transform .3s ease; z-index: 9; }
    .snack.show { transform: none; }
  </style>
</head>
<body>
  <div class="route-bar">Navigator route: <b id="route">/</b></div>

  <div class="phone">
    <!-- Route '/' -->
    <section class="screen" id="home">
      <div class="app-bar">Student Input Screen</div>
      <div class="scroll">
        <div class="banner">
          <div class="badge-ico">🎓</div>
          <div>
            <h1>Academic Performance Calculator</h1>
            <p>Enter student details and marks (out of 100).</p>
          </div>
        </div>
        <form class="panel" id="form" novalidate>
          <div class="field" data-f="name"><label>Student Name</label><input id="name" autocomplete="off" /><div class="err"></div></div>
          <div class="field" data-f="reg"><label>Registration Number</label><input id="reg" autocomplete="off" /><div class="err"></div></div>
          <div class="field" data-f="m1"><label>Mark 1</label><input id="m1" inputmode="decimal" autocomplete="off" /><div class="err"></div></div>
          <div class="field" data-f="m2"><label>Mark 2</label><input id="m2" inputmode="decimal" autocomplete="off" /><div class="err"></div></div>
          <div class="field" data-f="m3"><label>Mark 3</label><input id="m3" inputmode="decimal" autocomplete="off" /><div class="err"></div></div>
          <button type="submit" class="btn go">Submit →</button>
          <button type="button" class="link" id="clear">↺ Clear</button>
        </form>
      </div>
    </section>

    <!-- Route '/second' -->
    <section class="screen" id="second">
      <div class="app-bar"><button class="back" id="appBack" aria-label="Back">←</button>Student Result Screen</div>
      <div class="scroll" id="resultBody"></div>
    </section>

    <div class="snack" id="snack">Student Details Submitted..</div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  let user = null, snackTimer;

  // Same validators and messages as the Dart HomeScreen
  const rules = {
    name: v => !v.trim() ? 'Please enter the student name.'
      : !/^[A-Za-z][A-Za-z .']*$/.test(v.trim()) ? 'Name can contain only letters and spaces.' : null,
    reg: v => !v.trim() ? 'Please enter the registration number.'
      : !/^[A-Za-z0-9]+$/.test(v.trim()) ? 'Use letters and digits only (no spaces).' : null,
  };
  ['m1', 'm2', 'm3'].forEach((k, i) => rules[k] = v => {
    const label = 'Mark ' + (i + 1);
    if (!v.trim()) return `Please enter ${label}.`;
    const n = Number(v.trim());
    if (!Number.isFinite(n)) return 'Enter a valid number.';
    if (n < 0 || n > 100) return `${label} must be between 0 and 100.`;
    return null;
  });

  const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(2);
  const grade = p => p >= 90 ? 'O' : p >= 80 ? 'A+' : p >= 70 ? 'A' : p >= 60 ? 'B' : p >= 50 ? 'C' : 'F';

  function toast(msg) {
    $('snack').textContent = msg; $('snack').classList.add('show');
    clearTimeout(snackTimer); snackTimer = setTimeout(() => $('snack').classList.remove('show'), 2000);
  }

  // pushNamed('/second', arguments: user)
  function pushSecond(u) {
    user = u; renderResult();
    document.body.classList.add('on-second');
    $('route').textContent = '/second';
  }
  // Navigator.pop()
  function pop() {
    document.body.classList.remove('on-second');
    $('route').textContent = '/';
  }

  function renderResult() {
    const total = user.marks.reduce((a, b) => a + b, 0);
    const avg = total / 3, pct = total / 300 * 100;
    $('resultBody').innerHTML = `
      <div class="panel who"><div class="badge-ico">🧑‍🎓</div>
        <div><b>Name: ${user.name}</b><span>Reg No: ${user.reg}</span></div></div>
      <div class="panel ring-row">
        <div class="ring" style="--p:${pct}"><span>${pct.toFixed(2)}%</span></div>
        <div><small>Percentage</small><span class="grade">Grade ${grade(pct)}</span></div></div>
      <div class="panel"><div class="title">📖 Subject Marks</div>
        ${user.marks.map((m, i) => `<div class="mark"><div class="row"><span>Mark ${i + 1}</span><b>${fmt(m)} / 100</b></div>
          <div class="bar"><i style="width:${m}%"></i></div></div>`).join('')}</div>
      <div class="panel"><div class="title">🧮 Result</div>
        <div class="res"><span>Total Marks</span><b>${fmt(total)} / 300</b></div>
        <div class="res"><span>Average Marks</span><b>${avg.toFixed(2)}</b></div></div>
      <button class="btn back-btn" id="back">← Back</button>`;
    $('back').onclick = pop;
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    let ok = true;
    for (const k of Object.keys(rules)) {
      const msg = rules[k]($(k).value);
      const f = document.querySelector(`[data-f="${k}"]`);
      f.classList.toggle('bad', !!msg);
      f.querySelector('.err').textContent = msg || '';
      if (msg) ok = false;
    }
    if (!ok) return;
    pushSecond({ name: $('name').value.trim(), reg: $('reg').value.trim(), marks: ['m1', 'm2', 'm3'].map(k => Number($(k).value.trim())) });
    toast('Student Details Submitted..');
  });

  $('clear').onclick = () => {
    document.querySelectorAll('#form input').forEach(i => i.value = '');
    document.querySelectorAll('.field').forEach(f => { f.classList.remove('bad'); f.querySelector('.err').textContent = ''; });
  };
  $('appBack').onclick = pop;
</script>
</body>
</html>
